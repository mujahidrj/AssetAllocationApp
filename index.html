    <!-- Link previews (iMessage, WhatsApp, Slack, X). Absolute URLs: crawlers don't resolve relative ones. -->

    <script>
      // Set the theme before the page paints, so there's no flash of the wrong one
      (function () {
        try {
          var mode = localStorage.getItem('assetAllocation.theme');
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
